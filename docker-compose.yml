# Runs PostgreSQL locally so every developer has an identical database.
# Start it with:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_dev_password
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      # Named volume = data survives container restarts
      - inventory_pgdata:/var/lib/postgresql/data

volumes:
  inventory_pgdata:
